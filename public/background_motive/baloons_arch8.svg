<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2560" width="100%" height="100%" preserveAspectRatio="xMidYMin slice">
  <defs>
    <!-- Colores Pasteles MATE (Colores Planos sin degradados de brillo) -->
    <!-- Rosa Rubor Mate -->
    <linearGradient id="balloon-blush" x1="0%" y1="0%" x2="0%" y2="0%">
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- Crema Mate -->
    <linearGradient id="balloon-cream" x1="0%" y1="0%" x2="0%" y2="0%">
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Durazno Suave Mate -->
    <linearGradient id="balloon-peach" x1="0%" y1="0%" x2="0%" y2="0%">
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>

    <!-- Lavanda Clara Mate -->
    <linearGradient id="balloon-lavender" x1="0%" y1="0%" x2="0%" y2="0%">
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Color para la corona en primer plano: Rosa Claro -->
    <linearGradient id="crown-light-pink" x1="0%" y1="0%" x2="0%" y2="0%">
      <stop offset="100%" stop-color="#FF45B6" />
    </linearGradient>

    <!-- Sombra muy suave y delicada -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="5" flood-color="#9C27B0" flood-opacity="0.08" />
    </filter>

    <!-- MOLDE 1: Globo Esférico Tradicional (Sin elipse de brillo para efecto Mate) -->
    <g id="balloon-round">
      <path d="M 0,-70 C 50,-70 65,-20 50,40 C 35,80 12,85 0,85 C -12,85 -35,80 -50,40 C -65,-20 -50,-70 0,-70 Z" />
      <path d="M -6,85 L 6,85 L 10,95 L -10,95 Z" opacity="0.6" />
    </g>

    <!-- MOLDE 2: Globo con forma de Corazón (Sin curva de brillo para efecto Mate) -->
    <g id="balloon-heart">
      <path d="M 0,30 C -10,10 -60,-20 -60,-50 C -60,-80 -30,-90 0,-60 C 30,-90 60,-80 60,-50 C 60,-20 10,10 0,30 Z" />
      <path d="M -6,30 L 6,30 L 8,38 L -8,38 Z" opacity="0.6" />
    </g>

    <!-- MOLDE 3: Globo Estrella Suave (Sin reflejo para efecto Mate) -->
    <g id="balloon-star">
      <path d="M 0,-75 L 20,-25 L 70,-20 L 32,15 L 45,65 L 0,40 L -45,65 L -32,15 L -70,-20 L -20,-25 Z" />
      <polygon points="-5,40 5,40 7,48 -7,48" opacity="0.6" />
    </g>

    <!-- MOLDE 4: Corona de Princesa (Elemento Central) -->
    <g id="crown">
      <path d="M -50,30 L -60,-35 L -25,-5 L 0,-50 L 25,-5 L 60,-35 L 50,30 Z M -45,40 L 45,40 L 40,48 L -40,48 Z" fill-rule="evenodd" />
      <circle cx="-60" cy="-40" r="5" />
      <circle cx="0" cy="-55" r="6" />
      <circle cx="60" cy="-40" r="5" />
    </g>
  </defs>

  <g filter="url(#shadow)">
    
    <!-- 1. COLUMNA IZQUIERDA -->
    <g transform="translate(65, 1500)">
      <!-- Capa Trasera -->
      <use href="#balloon-round" fill="#FDBA74" transform="translate(10, 240) scale(1.15) rotate(10)" />
      <use href="#balloon-heart" fill="#F472B6" transform="translate(-20, 120) scale(1.2) rotate(-15)" />
      <use href="#balloon-round" fill="#C084FC" transform="scale(1.2) rotate(15)" />
      <use href="#balloon-star" fill="#FDE68A" transform="translate(-10, -120) scale(1.1) rotate(-20)" />
      <use href="#balloon-round" fill="#F472B6" transform="translate(40, -220) scale(1.25) rotate(10)" />
      <use href="#balloon-heart" fill="#FDBA74" transform="translate(-20, -340) scale(1.15) rotate(-15)" />
      <use href="#balloon-round" fill="#C084FC" transform="translate(30, -460) scale(1.3) rotate(25)" />
      <use href="#balloon-star" fill="#FDE68A" transform="translate(-15, -580) scale(1.2) rotate(-10)" />
      <use href="#balloon-round" fill="#F472B6" transform="translate(20, -700) scale(1.25) rotate(15)" />
      <use href="#balloon-heart" fill="#FDBA74" transform="translate(-10, -820) scale(1.2) rotate(-10)" />
      <use href="#balloon-round" fill="#C084FC" transform="translate(25, -940) scale(1.25) rotate(20)" />

      <!-- Capa Frontal -->
      <use href="#balloon-round" fill="#FDE68A" transform="translate(15, 180) scale(1.0) rotate(-5)" />
      <use href="#balloon-star" fill="#FDBA74" transform="translate(-10, 60) scale(1.05) rotate(20)" />
      <use href="#balloon-heart" fill="#F472B6" transform="translate(25, -60) scale(1.05) rotate(-10)" />
      <use href="#balloon-round" fill="#C084FC" transform="translate(20, -170) scale(0.95) rotate(30)" />
      <use href="#balloon-round" fill="#FDE68A" transform="translate(-15, -280) scale(1.05) rotate(-5)" />
      <use href="#balloon-star" fill="url(#balloon-peach)" transform="translate(35, -400) scale(1.0) rotate(20)" />
      <use href="#balloon-heart" fill="#F472B6" transform="translate(-10, -520) scale(1.1) rotate(-15)" />
      <use href="#balloon-round" fill="#C084FC" transform="translate(25, -640) scale(1.0) rotate(10)" />
      <use href="#balloon-round" fill="#FDE68A" transform="translate(-15, -760) scale(1.05) rotate(-15)" />
      <use href="#balloon-star" fill="#FDBA74" transform="translate(20, -880) scale(1.0) rotate(10)" />
    </g>

    <!-- 2. COLUMNA DERECHA -->
    <g transform="translate(1015, 1500)">
      <!-- Capa Trasera -->
      <use href="#balloon-star" fill="#FDE68A" transform="translate(-10, 240) scale(1.15) rotate(-10)" />
      <use href="#balloon-round" fill="#C084FC" transform="translate(20, 120) scale(1.2) rotate(15)" />
      <use href="#balloon-heart" fill="#F472B6" transform="scale(1.2) rotate(-15)" />
      <use href="#balloon-round" fill="#FDBA74" transform="translate(10, -120) scale(1.1) rotate(20)" />
      <use href="#balloon-star" fill="#FDE68A" transform="translate(-40, -220) scale(1.25) rotate(-10)" />
      <use href="#balloon-round" fill="#C084FC" transform="translate(20, -340) scale(1.15) rotate(15)" />
      <use href="#balloon-heart" fill="#F472B6" transform="translate(-30, -460) scale(1.3) rotate(-25)" />
      <use href="#balloon-round" fill="#FDBA74" transform="translate(15, -580) scale(1.2) rotate(10)" />
      <use href="#balloon-star" fill="#FDE68A" transform="translate(-20, -700) scale(1.25) rotate(-15)" />
      <use href="#balloon-heart" fill="#F472B6" transform="translate(10, -820) scale(1.2) rotate(10)" />
      <use href="#balloon-round" fill="#C084FC" transform="translate(-25, -940) scale(1.25) rotate(-20)" />

      <!-- Capa Frontal -->
      <use href="#balloon-heart" fill="#F472B6" transform="translate(-15, 180) scale(1.0) rotate(5)" />
      <use href="#balloon-round" fill="#FDE68A" transform="translate(10, 60) scale(1.05) rotate(-20)" />
      <use href="#balloon-round" fill="#C084FC" transform="translate(-25, -60) scale(1.05) rotate(10)" />
      <use href="#balloon-star" fill="#FDBA74" transform="translate(-20, -170) scale(0.95) rotate(-30)" />
      <use href="#balloon-heart" fill="#F472B6" transform="translate(15, -280) scale(1.05) rotate(5)" />
      <use href="#balloon-round" fill="#FDE68A" transform="translate(-35, -400) scale(1.0) rotate(-20)" />
      <use href="#balloon-round" fill="#C084FC" transform="translate(10, -520) scale(1.1) rotate(15)" />
      <use href="#balloon-star" fill="#FDBA74" transform="translate(-25, -640) scale(1.0) rotate(-10)" />
      <use href="#balloon-heart" fill="#F472B6" transform="translate(15, -760) scale(1.05) rotate(15)" />
      <use href="#balloon-round" fill="#FDE68A" transform="translate(-20, -880) scale(1.0) rotate(-10)" />
    </g>

    <!-- 3. GUIRNALDA SUPERIOR -->
    <g transform="translate(540, 110)">
      <!-- Capa Trasera Curva -->
      <use href="#balloon-round" fill="#C084FC" transform="translate(-420, 150) scale(1.3) rotate(45)" />
      <use href="#balloon-star" fill="#FDE68A" transform="translate(-300, 80) scale(1.25) rotate(25)" />
      <use href="#balloon-heart" fill="#F472B6" transform="translate(-160, 30) scale(1.2) rotate(10)" />
      
      <!-- La corona central original ha sido movida al final de esta sección para el primer plano -->
      
      <use href="#balloon-heart" fill="#F472B6" transform="translate(160, 30) scale(1.2) rotate(-10)" />
      <use href="#balloon-star" fill="#FDE68A" transform="translate(300, 80) scale(1.25) rotate(-25)" />
      <use href="#balloon-round" fill="#C084FC" transform="translate(420, 150) scale(1.3) rotate(-45)" />

      <!-- Capa Frontal Centro -->
      <use href="#balloon-heart" fill="#F472B6" transform="translate(-360, 110) scale(1.05) rotate(35)" />
      <use href="#balloon-round" fill="#FDE68A" transform="translate(-230, 40) scale(1.1) rotate(15)" />
      <use href="#balloon-star" fill="#FDBA74" transform="translate(-80, 0) scale(1.1) rotate(-5)" />
      <use href="#balloon-star" fill="#FDBA74" transform="translate(80, 0) scale(1.1) rotate(5)" />
      <use href="#balloon-round" fill="#C084FC" transform="translate(230, 40) scale(1.1) rotate(-15)" />
      <use href="#balloon-heart" fill="#F472B6" transform="translate(360, 110) scale(1.05) rotate(-35)" />

      <!-- ELEM CENTRAL EN PRIMER PLANO: Corona de color rosa claro -->
      <use href="#crown" fill="url(#crown-light-pink)" transform="translate(0, 0) scale(1.4)" />
    </g>

  </g>
</svg>
