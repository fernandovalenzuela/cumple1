<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2560" width="100%" height="100%" preserveAspectRatio="xMidYMin slice">
  <defs>
    <!-- Degradados para globos pastel -->
    <radialGradient id="balloon-pink" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="40%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#BE185D" />
    </radialGradient>

    <radialGradient id="balloon-blue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </radialGradient>

    <radialGradient id="balloon-gold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>

    <radialGradient id="balloon-white" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </radialGradient>

    <!-- Sombra suave para dar profundidad -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>

    <!-- Molde Reutilizable de Globo Individual -->
    <g id="balloon">
      <path d="M 0,-70 C 50,-70 65,-20 50,40 C 35,80 12,85 0,85 C -12,85 -35,80 -50,40 C -65,-20 -50,-70 0,-70 Z" />
      <path d="M -6,85 L 6,85 L 10,95 L -10,95 Z" opacity="0.8" />
      <ellipse cx="-20" cy="-35" rx="8" ry="18" transform="rotate(-25 -20 -35)" fill="#FFFFFF" opacity="0.45" />
    </g>
  </defs>

  <!-- GRUPO PRINCIPAL DEL ARCO -->
  <g filter="url(#shadow)">
    
    <!-- 1. COLUMNA IZQUIERDA (Extendida 1/3 más hacia abajo) -->
    <g transform="translate(60, 1500)">
      <!-- Capa trasera (globos añadidos en la base inferior) -->
      <use href="#balloon" fill="url(#balloon-gold)" transform="translate(10, 240) scale(1.15) rotate(10)" />
      <use href="#balloon" fill="url(#balloon-pink)" transform="translate(-20, 120) scale(1.2) rotate(-15)" />
      <use href="#balloon" fill="url(#balloon-white)" transform="scale(1.2) rotate(15)" />
      <use href="#balloon" fill="url(#balloon-blue)" transform="translate(-10, -120) scale(1.1) rotate(-20)" />
      <use href="#balloon" fill="url(#balloon-pink)" transform="translate(40, -220) scale(1.25) rotate(10)" />
      <use href="#balloon" fill="url(#balloon-gold)" transform="translate(-20, -340) scale(1.15) rotate(-15)" />
      <use href="#balloon" fill="url(#balloon-white)" transform="translate(30, -460) scale(1.3) rotate(25)" />
      <use href="#balloon" fill="url(#balloon-blue)" transform="translate(-15, -580) scale(1.2) rotate(-10)" />
      <use href="#balloon" fill="url(#balloon-pink)" transform="translate(20, -700) scale(1.25) rotate(15)" />
      <use href="#balloon" fill="url(#balloon-gold)" transform="translate(-10, -820) scale(1.2) rotate(-10)" />
      <use href="#balloon" fill="url(#balloon-white)" transform="translate(25, -940) scale(1.25) rotate(20)" />
      
      <!-- Capa frontal -->
      <use href="#balloon" fill="url(#balloon-blue)" transform="translate(15, 180) scale(1.0) rotate(-5)" />
      <use href="#balloon" fill="url(#balloon-white)" transform="translate(-10, 60) scale(1.05) rotate(20)" />
      <use href="#balloon" fill="url(#balloon-pink)" transform="translate(25, -60) scale(1.05) rotate(-10)" />
      <use href="#balloon" fill="url(#balloon-gold)" transform="translate(20, -170) scale(0.95) rotate(30)" />
      <use href="#balloon" fill="url(#balloon-white)" transform="translate(-15, -280) scale(1.05) rotate(-5)" />
      <use href="#balloon" fill="url(#balloon-blue)" transform="translate(35, -400) scale(1.0) rotate(20)" />
      <use href="#balloon" fill="url(#balloon-pink)" transform="translate(-10, -520) scale(1.1) rotate(-15)" />
      <use href="#balloon" fill="url(#balloon-gold)" transform="translate(25, -640) scale(1.0) rotate(10)" />
      <use href="#balloon" fill="url(#balloon-blue)" transform="translate(-15, -760) scale(1.05) rotate(-15)" />
      <use href="#balloon" fill="url(#balloon-pink)" transform="translate(20, -880) scale(1.0) rotate(10)" />
    </g>

    <!-- 2. COLUMNA DERECHA (Extendida 1/3 más hacia abajo) -->
    <g transform="translate(1020, 1500)">
      <!-- Capa trasera (globos añadidos en la base inferior) -->
      <use href="#balloon" fill="url(#balloon-blue)" transform="translate(-10, 240) scale(1.15) rotate(-10)" />
      <use href="#balloon" fill="url(#balloon-white)" transform="translate(20, 120) scale(1.2) rotate(15)" />
      <use href="#balloon" fill="url(#balloon-pink)" transform="scale(1.2) rotate(-15)" />
      <use href="#balloon" fill="url(#balloon-gold)" transform="translate(10, -120) scale(1.1) rotate(20)" />
      <use href="#balloon" fill="url(#balloon-blue)" transform="translate(-40, -220) scale(1.25) rotate(-10)" />
      <use href="#balloon" fill="url(#balloon-white)" transform="translate(20, -340) scale(1.15) rotate(15)" />
      <use href="#balloon" fill="url(#balloon-pink)" transform="translate(-30, -460) scale(1.3) rotate(-25)" />
      <use href="#balloon" fill="url(#balloon-gold)" transform="translate(15, -580) scale(1.2) rotate(10)" />
      <use href="#balloon" fill="url(#balloon-blue)" transform="translate(-20, -700) scale(1.25) rotate(-15)" />
      <use href="#balloon" fill="url(#balloon-pink)" transform="translate(10, -820) scale(1.2) rotate(10)" />
      <use href="#balloon" fill="url(#balloon-gold)" transform="translate(-25, -940) scale(1.25) rotate(-20)" />
      
      <!-- Capa frontal -->
      <use href="#balloon" fill="url(#balloon-pink)" transform="translate(-15, 180) scale(1.0) rotate(5)" />
      <use href="#balloon" fill="url(#balloon-gold)" transform="translate(10, 60) scale(1.05) rotate(-20)" />
      <use href="#balloon" fill="url(#balloon-blue)" transform="translate(-25, -60) scale(1.05) rotate(10)" />
      <use href="#balloon" fill="url(#balloon-white)" transform="translate(-20, -170) scale(0.95) rotate(-30)" />
      <use href="#balloon" fill="url(#balloon-pink)" transform="translate(15, -280) scale(1.05) rotate(5)" />
      <use href="#balloon" fill="url(#balloon-gold)" transform="translate(-35, -400) scale(1.0) rotate(-20)" />
      <use href="#balloon" fill="url(#balloon-white)" transform="translate(10, -520) scale(1.1) rotate(15)" />
      <use href="#balloon" fill="url(#balloon-blue)" transform="translate(-25, -640) scale(1.0) rotate(-10)" />
      <use href="#balloon" fill="url(#balloon-gold)" transform="translate(15, -760) scale(1.05) rotate(15)" />
      <use href="#balloon" fill="url(#balloon-white)" transform="translate(-20, -880) scale(1.0) rotate(-10)" />
    </g>

    <!-- 3. GUIRNALDA SUPERIOR -->
    <g transform="translate(540, 100)">
      <use href="#balloon" fill="url(#balloon-gold)" transform="translate(-420, 150) scale(1.3) rotate(45)" />
      <use href="#balloon" fill="url(#balloon-pink)" transform="translate(-300, 80) scale(1.25) rotate(25)" />
      <use href="#balloon" fill="url(#balloon-white)" transform="translate(-160, 30) scale(1.2) rotate(10)" />
      <use href="#balloon" fill="url(#balloon-blue)" transform="translate(0, 10) scale(1.3) rotate(0)" />
      <use href="#balloon" fill="url(#balloon-pink)" transform="translate(160, 30) scale(1.2) rotate(-10)" />
      <use href="#balloon" fill="url(#balloon-gold)" transform="translate(300, 80) scale(1.25) rotate(-25)" />
      <use href="#balloon" fill="url(#balloon-blue)" transform="translate(420, 150) scale(1.3) rotate(-45)" />

      <use href="#balloon" fill="url(#balloon-blue)" transform="translate(-360, 110) scale(1.05) rotate(35)" />
      <use href="#balloon" fill="url(#balloon-white)" transform="translate(-230, 40) scale(1.1) rotate(15)" />
      <use href="#balloon" fill="url(#balloon-gold)" transform="translate(-80, 0) scale(1.05) rotate(-5)" />
      <use href="#balloon" fill="url(#balloon-pink)" transform="translate(80, 0) scale(1.05) rotate(5)" />
      <use href="#balloon" fill="url(#balloon-white)" transform="translate(230, 40) scale(1.1) rotate(-15)" />
      <use href="#balloon" fill="url(#balloon-pink)" transform="translate(360, 110) scale(1.05) rotate(-35)" />
    </g>
  </g>
</svg>
