<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- JUGUETE 1: Osito de Peluche (Izquierda Superior) -->
    <g transform="translate(60, 40)">
      <!-- Orejas -->
      <circle cx="45" cy="45" r="16" fill="#D4A373" stroke="#8C5E3C" stroke-width="2.5" />
      <circle cx="45" cy="45" r="8" fill="#FAEDCD" />
      <circle cx="115" cy="45" r="16" fill="#D4A373" stroke="#8C5E3C" stroke-width="2.5" />
      <circle cx="115" cy="45" r="8" fill="#FAEDCD" />
      <!-- Cuerpo -->
      <ellipse cx="80" cy="120" rx="40" ry="35" fill="#CCD5AE" stroke="#8C5E3C" stroke-width="2.5" />
      <ellipse cx="80" cy="120" rx="25" ry="20" fill="#FAEDCD" />
      <!-- Cabeza -->
      <circle cx="80" cy="70" r="35" fill="#D4A373" stroke="#8C5E3C" stroke-width="2.5" />
      <!-- Hocico y Cara -->
      <ellipse cx="80" cy="78" rx="14" ry="10" fill="#FAEDCD" />
      <polygon points="76,73 84,73 80,78" fill="#582F0E" />
      <circle cx="68" cy="62" r="3.5" fill="#582F0E" />
      <circle cx="92" cy="62" r="3.5" fill="#582F0E" />
      <!-- Brazos y Patas -->
      <circle cx="35" cy="115" r="12" fill="#D4A373" stroke="#8C5E3C" stroke-width="2" />
      <circle cx="125" cy="115" r="12" fill="#D4A373" stroke="#8C5E3C" stroke-width="2" />
      <ellipse cx="50" cy="150" rx="14" ry="10" fill="#D4A373" stroke="#8C5E3C" stroke-width="2" />
      <ellipse cx="110" cy="150" rx="14" ry="10" fill="#D4A373" stroke="#8C5E3C" stroke-width="2" />
    </g>

    <!-- JUGUETE 2: Robot de Juguete (Centro Superior) -->
    <g transform="translate(330, 30)">
      <!-- Antena -->
      <line x1="60" y1="25" x2="60" y2="40" stroke="#457B9D" stroke-width="3" />
      <circle cx="60" cy="20" r="6" fill="#E63946" />
      <!-- Cabeza -->
      <rect x="35" y="40" width="50" height="35" rx="6" fill="#A8DADC" stroke="#1D3557" stroke-width="2.5" />
      <circle cx="48" cy="55" r="5" fill="#FFE66D" stroke="#1D3557" stroke-width="1.5" />
      <circle cx="72" cy="55" r="5" fill="#FFE66D" stroke="#1D3557" stroke-width="1.5" />
      <line x1="48" y1="68" x2="72" y2="68" stroke="#1D3557" stroke-width="2" />
      <!-- Cuerpo -->
      <rect x="25" y="80" width="70" height="60" rx="8" fill="#457B9D" stroke="#1D3557" stroke-width="2.5" />
      <circle cx="45" cy="100" r="8" fill="#E63946" />
      <circle cx="75" cy="100" r="8" fill="#06D6A0" />
      <rect x="40" y="118" width="40" height="12" rx="3" fill="#F1FAEE" stroke="#1D3557" stroke-width="1.5" />
      <!-- Extremidades -->
      <rect x="5" y="85" width="15" height="35" rx="4" fill="#A8DADC" stroke="#1D3557" stroke-width="2" />
      <rect x="100" y="85" width="15" height="35" rx="4" fill="#A8DADC" stroke="#1D3557" stroke-width="2" />
      <rect x="35" y="143" width="18" height="20" rx="3" fill="#1D3557" />
      <rect x="67" y="143" width="18" height="20" rx="3" fill="#1D3557" />
    </g>

    <!-- JUGUETE 3: Cubos con Letras A-B-C (Derecha Superior) -->
    <g transform="translate(580, 50)">
      <!-- Cubo A -->
      <rect x="0" y="60" width="50" height="50" rx="6" fill="#FF70A6" stroke="#C9184A" stroke-width="2.5" />
      <text x="25" y="93" font-family="sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF" text-anchor="middle">A</text>
      <!-- Cubo B -->
      <rect x="40" y="20" width="50" height="50" rx="6" fill="#70D6FF" stroke="#0077B6" stroke-width="2.5" />
      <text x="65" y="53" font-family="sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF" text-anchor="middle">B</text>
      <!-- Cubo C -->
      <rect x="70" y="70" width="50" height="50" rx="6" fill="#FFD166" stroke="#F4A261" stroke-width="2.5" />
      <text x="95" y="103" font-family="sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF" text-anchor="middle">C</text>
    </g>

    <!-- JUGUETE 4: Cochecito / Carrito Rojo (Izquierda Inferior) -->
    <g transform="translate(50, 320)">
      <!-- Cuerpo -->
      <path d="M 10 50 L 30 20 C 40 10, 80 10, 100 20 L 130 25 L 150 50 Z" fill="#EF233C" stroke="#D90429" stroke-width="2.5" />
      <rect x="5" y="50" width="150" height="30" rx="6" fill="#EF233C" stroke="#D90429" stroke-width="2.5" />
      <!-- Ventana -->
      <path d="M 40 25 L 75 25 L 75 45 L 30 45 Z" fill="#EDF2F4" stroke="#D90429" stroke-width="1.5" />
      <!-- Ruedas -->
      <circle cx="40" cy="80" r="16" fill="#2B2D42" />
      <circle cx="40" cy="80" r="7" fill="#8D99AE" />
      <circle cx="120" cy="80" r="16" fill="#2B2D42" />
      <circle cx="120" cy="80" r="7" fill="#8D99AE" />
    </g>

    <!-- JUGUETE 5: Patito de Goma (Centro Inferior) -->
    <g transform="translate(340, 330)">
      <!-- Cuerpo -->
      <path d="M 20 60 C 0 60, 0 100, 40 100 C 90 100, 100 80, 80 60 Z" fill="#FFD166" stroke="#E9C46A" stroke-width="2.5" />
      <!-- Cabeza -->
      <circle cx="30" cy="40" r="22" fill="#FFD166" stroke="#E9C46A" stroke-width="2.5" />
      <circle cx="22" cy="33" r="3" fill="#2B2D42" />
      <!-- Pico -->
      <path d="M 12 40 Q 0 42 10 50 Z" fill="#F4A261" stroke="#E76F51" stroke-width="2" />
      <!-- Ala -->
      <path d="M 45 75 C 35 75, 35 90, 55 85 Z" fill="#F4A261" stroke="#E76F51" stroke-width="1.5" />
    </g>

    <!-- JUGUETE 6: Trompo / Peonza (Derecha Inferior) -->
    <g transform="translate(580, 320)">
      <ellipse cx="60" cy="20" rx="10" ry="5" fill="#8D99AE" />
      <rect x="57" y="20" width="6" height="15" fill="#8D99AE" />
      <!-- Franjas coloridas del trompo -->
      <path d="M 20 40 Q 60 25 100 40 L 80 80 Q 60 90 40 80 Z" fill="#06D6A0" stroke="#118AB2" stroke-width="2" />
      <path d="M 28 50 Q 60 38 92 50 L 75 95 Q 60 105 45 95 Z" fill="#FF70A6" stroke="#C9184A" stroke-width="2" />
      <path d="M 38 65 Q 60 55 82 65 L 60 120 Z" fill="#FFD166" stroke="#F4A261" stroke-width="2" />
      <!-- Punta -->
      <circle cx="60" cy="122" r="3" fill="#2B2D42" />
    </g>

    <!-- JUGUETE 7: Pelota de Colores Pequeña -->
    <g transform="translate(250, 220)">
      <circle cx="35" cy="35" r="28" fill="#3A86FF" stroke="#05668D" stroke-width="2.5" />
      <path d="M 12 22 A 28 28 0 0 0 58 22 Z" fill="#FF006E" />
      <path d="M 12 48 A 28 28 0 0 1 58 48 Z" fill="#FFBE0B" />
      <circle cx="35" cy="35" r="28" fill="none" stroke="#2B2D42" stroke-width="2" />
    </g>

    <!-- Estrellitas y destellos decorativos flotantes -->
    <path d="M 270 90 L 275 105 L 290 105 L 278 115 L 282 130 L 270 120 L 258 130 L 262 115 L 250 105 L 265 105 Z" fill="#FFD166" />
    <path d="M 520 280 L 523 290 L 533 290 L 525 296 L 528 306 L 520 300 L 512 306 L 515 296 L 507 290 L 517 290 Z" fill="#FF70A6" />
    <circle cx="180" cy="280" r="4" fill="#06D6A0" />
    <circle cx="530" cy="190" r="6" fill="#70D6FF" />

  </g>
</svg>
