<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2560" width="100%" height="100%" preserveAspectRatio="xMidYMin slice">
  <defs>
    <!-- Patrón de Pentágono para los cascos de la pelota -->
    <g id="soccer-pattern">
      <!-- Centro y parches negros -->
      <polygon points="0,-22 21,-7 13,18 -13,18 -21,-7" fill="#1E293B" />
      <polygon points="0,-70 12,-48 -12,-48" fill="#1E293B" />
      <polygon points="65,-20 45,-25 50,-2" fill="#1E293B" />
      <polygon points="40,55 35,32 55,25" fill="#1E293B" />
      <polygon points="-40,55 -35,32 -55,25" fill="#1E293B" />
      <polygon points="-65,-20 -45,-25 -50,-2" fill="#1E293B" />
      <!-- Líneas de costura -->
      <path d="M 0,-22 L 0,-48 M 21,-7 L 45,-25 M 13,18 L 35,32 M -13,18 L -35,32 M -21,-7 L -45,-25" stroke="#CBD5E1" stroke-width="2" opacity="0.6" />
    </g>

    <!-- PALETA ALEGRE Y DEPORTIVA -->
    <!-- 1. Pelota Tradicional Blanca -->
    <radialGradient id="ball-white" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </radialGradient>

    <!-- 2. Pelota Azul Francia (Alegre / Deportivo) -->
    <radialGradient id="ball-blue" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="65%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </radialGradient>

    <!-- 3. Pelota Verde Césped (Llamativo) -->
    <radialGradient id="ball-green" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="65%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </radialGradient>

    <!-- 4. Pelota Amarillo Vivo -->
    <radialGradient id="ball-yellow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="65%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </radialGradient>

    <!-- Sombra de integración -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>

    <!-- MOLDE 1: Pelota de Fútbol Clásica Blanca -->
    <g id="soccer-classic">
      <circle cx="0" cy="0" r="68" fill="url(#ball-white)" />
      <use href="#soccer-pattern" />
      <!-- Nudo -->
      <path d="M -6,68 L 6,68 L 8,76 L -8,76 Z" fill="#94A3B8" />
      <!-- Brillo esférico -->
      <ellipse cx="-22" cy="-30" rx="12" ry="25" transform="rotate(-25 -22 -30)" fill="#FFFFFF" opacity="0.4" />
    </g>

    <!-- MOLDE 2: Pelota de Color Liso (Azul, Verde, Amarillo) -->
    <g id="soccer-color">
      <circle cx="0" cy="0" r="68" />
      <!-- Textura sutil de cascos -->
      <use href="#soccer-pattern" opacity="0.15" />
      <!-- Nudo -->
      <path d="M -6,68 L 6,68 L 8,76 L -8,76 Z" fill="#64748B" opacity="0.6" />
      <!-- Brillo esférico -->
      <ellipse cx="-22" cy="-30" rx="12" ry="25" transform="rotate(-25 -22 -30)" fill="#FFFFFF" opacity="0.35" />
    </g>
  </defs>

  <g filter="url(#soft-shadow)">
    
    <!-- 1. COLUMNA IZQUIERDA -->
    <g transform="translate(85, 1500)">
      <!-- Capa Trasera -->
      <use href="#soccer-color" fill="url(#ball-blue)" transform="translate(10, 240) scale(1.15) rotate(10)" />
      <use href="#soccer-classic" transform="translate(-20, 120) scale(1.2) rotate(-15)" />
      <use href="#soccer-color" fill="url(#ball-green)" transform="scale(1.2) rotate(15)" />
      <use href="#soccer-color" fill="url(#ball-yellow)" transform="translate(-10, -120) scale(1.1) rotate(-20)" />
      <use href="#soccer-classic" transform="translate(40, -220) scale(1.25) rotate(10)" />
      <use href="#soccer-color" fill="url(#ball-blue)" transform="translate(-20, -340) scale(1.15) rotate(-15)" />
      <use href="#soccer-color" fill="url(#ball-green)" transform="translate(30, -460) scale(1.3) rotate(25)" />
      <use href="#soccer-classic" transform="translate(-15, -580) scale(1.2) rotate(-10)" />
      <use href="#soccer-color" fill="url(#ball-yellow)" transform="translate(20, -700) scale(1.25) rotate(15)" />
      <use href="#soccer-color" fill="url(#ball-blue)" transform="translate(-10, -820) scale(1.2) rotate(-10)" />
      <use href="#soccer-classic" transform="translate(25, -940) scale(1.25) rotate(20)" />

      <!-- Capa Frontal -->
      <use href="#soccer-color" fill="url(#ball-yellow)" transform="translate(15, 180) scale(1.0) rotate(-5)" />
      <use href="#soccer-color" fill="url(#ball-green)" transform="translate(-10, 60) scale(1.05) rotate(20)" />
      <use href="#soccer-classic" transform="translate(25, -60) scale(1.05) rotate(-10)" />
      <use href="#soccer-color" fill="url(#ball-blue)" transform="translate(20, -170) scale(0.95) rotate(30)" />
      <use href="#soccer-color" fill="url(#ball-yellow)" transform="translate(-15, -280) scale(1.05) rotate(-5)" />
      <use href="#soccer-classic" transform="translate(35, -400) scale(1.0) rotate(20)" />
      <use href="#soccer-color" fill="url(#ball-green)" transform="translate(-10, -520) scale(1.1) rotate(-15)" />
      <use href="#soccer-color" fill="url(#ball-blue)" transform="translate(25, -640) scale(1.0) rotate(10)" />
      <use href="#soccer-color" fill="url(#ball-yellow)" transform="translate(-15, -760) scale(1.05) rotate(-15)" />
      <use href="#soccer-classic" transform="translate(20, -880) scale(1.0) rotate(10)" />
    </g>

    <!-- 2. COLUMNA DERECHA -->
    <g transform="translate(995, 1500)">
      <!-- Capa Trasera -->
      <use href="#soccer-color" fill="url(#ball-green)" transform="translate(-10, 240) scale(1.15) rotate(-10)" />
      <use href="#soccer-classic" transform="translate(20, 120) scale(1.2) rotate(15)" />
      <use href="#soccer-color" fill="url(#ball-blue)" transform="scale(1.2) rotate(-15)" />
      <use href="#soccer-color" fill="url(#ball-yellow)" transform="translate(10, -120) scale(1.1) rotate(20)" />
      <use href="#soccer-classic" transform="translate(-40, -220) scale(1.25) rotate(-10)" />
      <use href="#soccer-color" fill="url(#ball-green)" transform="translate(20, -340) scale(1.15) rotate(15)" />
      <use href="#soccer-color" fill="url(#ball-blue)" transform="translate(-30, -460) scale(1.3) rotate(-25)" />
      <use href="#soccer-classic" transform="translate(15, -580) scale(1.2) rotate(10)" />
      <use href="#soccer-color" fill="url(#ball-yellow)" transform="translate(-20, -700) scale(1.25) rotate(-15)" />
      <use href="#soccer-color" fill="url(#ball-green)" transform="translate(10, -820) scale(1.2) rotate(10)" />
      <use href="#soccer-color" fill="url(#ball-blue)" transform="translate(-25, -940) scale(1.25) rotate(-20)" />

      <!-- Capa Frontal -->
      <use href="#soccer-classic" transform="translate(-15, 180) scale(1.0) rotate(5)" />
      <use href="#soccer-color" fill="url(#ball-yellow)" transform="translate(10, 60) scale(1.05) rotate(-20)" />
      <use href="#soccer-color" fill="url(#ball-blue)" transform="translate(-25, -60) scale(1.05) rotate(10)" />
      <use href="#soccer-color" fill="url(#ball-green)" transform="translate(-20, -170) scale(0.95) rotate(-30)" />
      <use href="#soccer-classic" transform="translate(15, -280) scale(1.05) rotate(5)" />
      <use href="#soccer-color" fill="url(#ball-yellow)" transform="translate(-35, -400) scale(1.0) rotate(-20)" />
      <use href="#soccer-color" fill="url(#ball-blue)" transform="translate(10, -520) scale(1.1) rotate(15)" />
      <use href="#soccer-classic" transform="translate(-25, -640) scale(1.0) rotate(-10)" />
      <use href="#soccer-color" fill="url(#ball-green)" transform="translate(15, -760) scale(1.05) rotate(15)" />
      <use href="#soccer-color" fill="url(#ball-yellow)" transform="translate(-20, -880) scale(1.0) rotate(-10)" />
    </g>

    <!-- 3. GUIRNALDA SUPERIOR EN ARCO -->
    <g transform="translate(540, 110)">
      <!-- Capa Trasera Curva -->
      <use href="#soccer-color" fill="url(#ball-blue)" transform="translate(-420, 150) scale(1.3) rotate(45)" />
      <use href="#soccer-classic" transform="translate(-300, 80) scale(1.25) rotate(25)" />
      <use href="#soccer-color" fill="url(#ball-green)" transform="translate(-160, 30) scale(1.2) rotate(10)" />
      <use href="#soccer-color" fill="url(#ball-yellow)" transform="translate(0, 10) scale(1.3) rotate(0)" />
      <use href="#soccer-color" fill="url(#ball-green)" transform="translate(160, 30) scale(1.2) rotate(-10)" />
      <use href="#soccer-classic" transform="translate(300, 80) scale(1.25) rotate(-25)" />
      <use href="#soccer-color" fill="url(#ball-blue)" transform="translate(420, 150) scale(1.3) rotate(-45)" />

      <!-- Capa Frontal Centro -->
      <use href="#soccer-color" fill="url(#ball-yellow)" transform="translate(-360, 110) scale(1.05) rotate(35)" />
      <use href="#soccer-color" fill="url(#ball-blue)" transform="translate(-230, 40) scale(1.1) rotate(15)" />
      <use href="#soccer-classic" transform="translate(-80, 0) scale(1.1) rotate(-5)" />
      <use href="#soccer-classic" transform="translate(80, 0) scale(1.1) rotate(5)" />
      <use href="#soccer-color" fill="url(#ball-blue)" transform="translate(230, 40) scale(1.1) rotate(-15)" />
      <use href="#soccer-color" fill="url(#ball-yellow)" transform="translate(360, 110) scale(1.05) rotate(-35)" />
    </g>

  </g>
</svg>
