<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2560" width="100%" height="100%" preserveAspectRatio="xMidYMin slice">
  <defs>
    <!-- Gradientes estilo MATE PASTEL extraídos de la imagen de referencia -->
    
    <!-- 1. Amarillo Pastel -->
    <radialGradient id="ref-yellow" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF7CD" />
      <stop offset="60%" stop-color="#FFE08A" />
      <stop offset="100%" stop-color="#F3C856" />
    </radialGradient>

    <!-- 2. Rosa Pastel -->
    <radialGradient id="ref-pink" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFD8E4" />
      <stop offset="60%" stop-color="#FAA7B8" />
      <stop offset="100%" stop-color="#F2859C" />
    </radialGradient>

    <!-- 3. Celeste Pastel -->
    <radialGradient id="ref-blue" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#D7F3FF" />
      <stop offset="60%" stop-color="#80D0FA" />
      <stop offset="100%" stop-color="#55B2EC" />
    </radialGradient>

    <!-- 4. Verde Pastel -->
    <radialGradient id="ref-green" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E2F7D8" />
      <stop offset="60%" stop-color="#A5DB98" />
      <stop offset="100%" stop-color="#80C070" />
    </radialGradient>

    <!-- 5. Violeta / Lila Pastel -->
    <radialGradient id="ref-purple" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#EFDDF8" />
      <stop offset="60%" stop-color="#D5B1E5" />
      <stop offset="100%" stop-color="#B88BCA" />
    </radialGradient>

    <!-- Sombra suave entre capas -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#4A3E50" flood-opacity="0.18" />
    </filter>

    <!-- MÓDULO ÚNICO: Globo de Corazón -->
    <g id="balloon-heart">
      <path d="M 0,35 C -10,15 -65,-15 -65,-50 C -65,-80 -35,-90 0,-60 C 35,-90 65,-80 65,-50 C 65,-15 10,15 0,35 Z" />
      <!-- Nudo del globo -->
      <path d="M -6,35 L 6,35 L 8,43 L -8,43 Z" fill="#D1B898" opacity="0.75" />
      <!-- Brillo sutil satinado estilo la imagen de ejemplo -->
      <ellipse cx="-20" cy="-45" rx="6" ry="14" transform="rotate(-25 -20 -45)" fill="#FFFFFF" opacity="0.35" />
    </g>
  </defs>

  <g filter="url(#soft-shadow)">
    
    <!-- 1. COLUMNA IZQUIERDA -->
    <g transform="translate(70, 1500)">
      <!-- Capa Trasera -->
      <use href="#balloon-heart" fill="url(#ref-yellow)" transform="translate(10, 240) scale(1.2) rotate(10)" />
      <use href="#balloon-heart" fill="url(#ref-pink)" transform="translate(-20, 120) scale(1.25) rotate(-15)" />
      <use href="#balloon-heart" fill="url(#ref-blue)" transform="scale(1.2) rotate(15)" />
      <use href="#balloon-heart" fill="url(#ref-green)" transform="translate(-10, -120) scale(1.15) rotate(-20)" />
      <use href="#balloon-heart" fill="url(#ref-purple)" transform="translate(40, -220) scale(1.25) rotate(10)" />
      <use href="#balloon-heart" fill="url(#ref-yellow)" transform="translate(-20, -340) scale(1.2) rotate(-15)" />
      <use href="#balloon-heart" fill="url(#ref-pink)" transform="translate(30, -460) scale(1.3) rotate(25)" />
      <use href="#balloon-heart" fill="url(#ref-blue)" transform="translate(-15, -580) scale(1.2) rotate(-10)" />
      <use href="#balloon-heart" fill="url(#ref-green)" transform="translate(20, -700) scale(1.25) rotate(15)" />
      <use href="#balloon-heart" fill="url(#ref-purple)" transform="translate(-10, -820) scale(1.2) rotate(-10)" />
      <use href="#balloon-heart" fill="url(#ref-yellow)" transform="translate(25, -940) scale(1.25) rotate(20)" />

      <!-- Capa Frontal -->
      <use href="#balloon-heart" fill="url(#ref-purple)" transform="translate(15, 180) scale(1.0) rotate(-5)" />
      <use href="#balloon-heart" fill="url(#ref-green)" transform="translate(-10, 60) scale(1.05) rotate(20)" />
      <use href="#balloon-heart" fill="url(#ref-blue)" transform="translate(25, -60) scale(1.05) rotate(-10)" />
      <use href="#balloon-heart" fill="url(#ref-pink)" transform="translate(20, -170) scale(0.95) rotate(30)" />
      <use href="#balloon-heart" fill="url(#ref-yellow)" transform="translate(-15, -280) scale(1.05) rotate(-5)" />
      <use href="#balloon-heart" fill="url(#ref-purple)" transform="translate(35, -400) scale(1.0) rotate(20)" />
      <use href="#balloon-heart" fill="url(#ref-green)" transform="translate(-10, -520) scale(1.1) rotate(-15)" />
      <use href="#balloon-heart" fill="url(#ref-blue)" transform="translate(25, -640) scale(1.0) rotate(10)" />
      <use href="#balloon-heart" fill="url(#ref-pink)" transform="translate(-15, -760) scale(1.05) rotate(-15)" />
      <use href="#balloon-heart" fill="url(#ref-yellow)" transform="translate(20, -880) scale(1.0) rotate(10)" />
    </g>

    <!-- 2. COLUMNA DERECHA -->
    <g transform="translate(1010, 1500)">
      <!-- Capa Trasera -->
      <use href="#balloon-heart" fill="url(#ref-blue)" transform="translate(-10, 240) scale(1.2) rotate(-10)" />
      <use href="#balloon-heart" fill="url(#ref-green)" transform="translate(20, 120) scale(1.25) rotate(15)" />
      <use href="#balloon-heart" fill="url(#ref-purple)" transform="scale(1.2) rotate(-15)" />
      <use href="#balloon-heart" fill="url(#ref-yellow)" transform="translate(10, -120) scale(1.15) rotate(20)" />
      <use href="#balloon-heart" fill="url(#ref-pink)" transform="translate(-40, -220) scale(1.25) rotate(-10)" />
      <use href="#balloon-heart" fill="url(#ref-blue)" transform="translate(20, -340) scale(1.2) rotate(15)" />
      <use href="#balloon-heart" fill="url(#ref-green)" transform="translate(-30, -460) scale(1.3) rotate(-25)" />
      <use href="#balloon-heart" fill="url(#ref-purple)" transform="translate(15, -580) scale(1.2) rotate(10)" />
      <use href="#balloon-heart" fill="url(#ref-yellow)" transform="translate(-20, -700) scale(1.25) rotate(-15)" />
      <use href="#balloon-heart" fill="url(#ref-pink)" transform="translate(10, -820) scale(1.2) rotate(10)" />
      <use href="#balloon-heart" fill="url(#ref-blue)" transform="translate(-25, -940) scale(1.25) rotate(-20)" />

      <!-- Capa Frontal -->
      <use href="#balloon-heart" fill="url(#ref-pink)" transform="translate(-15, 180) scale(1.0) rotate(5)" />
      <use href="#balloon-heart" fill="url(#ref-yellow)" transform="translate(10, 60) scale(1.05) rotate(-20)" />
      <use href="#balloon-heart" fill="url(#ref-purple)" transform="translate(-25, -60) scale(1.05) rotate(10)" />
      <use href="#balloon-heart" fill="url(#ref-green)" transform="translate(-20, -170) scale(0.95) rotate(-30)" />
      <use href="#balloon-heart" fill="url(#ref-blue)" transform="translate(15, -280) scale(1.05) rotate(5)" />
      <use href="#balloon-heart" fill="url(#ref-pink)" transform="translate(-35, -400) scale(1.0) rotate(-20)" />
      <use href="#balloon-heart" fill="url(#ref-yellow)" transform="translate(10, -520) scale(1.1) rotate(15)" />
      <use href="#balloon-heart" fill="url(#ref-purple)" transform="translate(-25, -640) scale(1.0) rotate(-10)" />
      <use href="#balloon-heart" fill="url(#ref-green)" transform="translate(15, -760) scale(1.05) rotate(15)" />
      <use href="#balloon-heart" fill="url(#ref-blue)" transform="translate(-20, -880) scale(1.0) rotate(-10)" />
    </g>

    <!-- 3. GUIRNALDA SUPERIOR -->
    <g transform="translate(540, 110)">
      <!-- Capa Trasera Curva -->
      <use href="#balloon-heart" fill="url(#ref-purple)" transform="translate(-420, 150) scale(1.3) rotate(45)" />
      <use href="#balloon-heart" fill="url(#ref-green)" transform="translate(-300, 80) scale(1.25) rotate(25)" />
      <use href="#balloon-heart" fill="url(#ref-blue)" transform="translate(-160, 30) scale(1.2) rotate(10)" />
      <use href="#balloon-heart" fill="url(#ref-yellow)" transform="translate(0, 10) scale(1.3) rotate(0)" />
      <use href="#balloon-heart" fill="url(#ref-pink)" transform="translate(160, 30) scale(1.2) rotate(-10)" />
      <use href="#balloon-heart" fill="url(#ref-purple)" transform="translate(300, 80) scale(1.25) rotate(-25)" />
      <use href="#balloon-heart" fill="url(#ref-green)" transform="translate(420, 150) scale(1.3) rotate(-45)" />

      <!-- Capa Frontal Centro -->
      <use href="#balloon-heart" fill="url(#ref-pink)" transform="translate(-360, 110) scale(1.05) rotate(35)" />
      <use href="#balloon-heart" fill="url(#ref-yellow)" transform="translate(-230, 40) scale(1.1) rotate(15)" />
      <use href="#balloon-heart" fill="url(#ref-blue)" transform="translate(-80, 0) scale(1.1) rotate(-5)" />
      <use href="#balloon-heart" fill="url(#ref-green)" transform="translate(80, 0) scale(1.1) rotate(5)" />
      <use href="#balloon-heart" fill="url(#ref-purple)" transform="translate(230, 40) scale(1.1) rotate(-15)" />
      <use href="#balloon-heart" fill="url(#ref-pink)" transform="translate(360, 110) scale(1.05) rotate(-35)" />
    </g>

  </g>
</svg>
